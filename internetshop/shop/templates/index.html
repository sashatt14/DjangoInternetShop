{% load static %}
<link rel="stylesheet" href="{% static 'style.css' %}">
<div class="navigation">
    <h1><span class="wordh1">Смех</span>Шоп</h1>
    <a class="navlink" href="/">Главная</a>
    <a class="navlink" href="/products">Товары</a>
    <a class="navlink" href="/aboutus">О нас</a>
</div>

<form class="filter">

    <input class="searchInput" name="search"  value="{{ search }}" placeholder="Название товара"/>
    <button style="width:30%">Искать!</button>
</form>

<div class="productList">
{% for product in products %}
<div class="product">
  <img style="margin-left:30px;margin-top:20px" class="productPreview" src="{{product.image_url}}"/>
    <div>
        <a href="/product/{{ product.id }}">
            <h2 style="margin-left:30px">{{ product.name }}</h2>
        </a>
        <p style="margin-left:30px">
            {{product.description}}
        </p>
    </div>
    <div class="price">
        <h3> {{product.price}} ₽ </h3>
        <a href="/payment/{{ product.id }}">
            <button>Купить</button>
        </a>
        </form>
    </div>
</div>
{% endfor %}

{% if not products_found %}
    <h2 style="width:20%"> Ничего не найдено </h2>
{% endif %}

<ul>
    <li><a href="{% url 'about' %}">О нас</a></li>
    <!-- другие пункты меню -->
</ul>
